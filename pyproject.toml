[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-community>=0.4.0,<0.5",
  "langchain-groq>=1.0,<2",
  "langchain-huggingface>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langchain-chroma>=1.0,<2",
  "langgraph>=1.0,<2",
  "chromadb>=1.0.20,<2",
  "sentence-transformers>=3.0.0,<4",
  "pypdf>=5.0.0,<6",
  "pandas>=2.2.0,<3",
  "pydantic>=2.0.0,<3",
  "pydantic-settings>=2.0.0,<3",
  "python-dotenv>=1.0.0,<2",
  "typer>=0.12.0,<0.16",
  "rich>=13.0.0,<14",
  "streamlit>=1.32.0,<2",
  "PyYAML>=6.0.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9", "pytest-mock>=3.14.0,<4"]

[project.scripts]
emporio-agent = "emporio_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
