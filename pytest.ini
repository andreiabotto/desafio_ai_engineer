[pytest]
testpaths = tests
pythonpath = src
markers =
    unit: unit tests that do not require network or LLM
    integration: agent integration tests with mocked LLM
    live: optional smoke tests that call the real Groq API
addopts = -m "not live"
filterwarnings =
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning:langsmith
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning:chromadb